<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>任务1-旋转缩放版</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }

        .box {
            width: 300px;
            height: 300px;
            border-radius: 20px;
            animation: rotateScale 8s infinite linear;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #fff;
            font-weight: bold;
        }

        @keyframes rotateScale {
            0% {
                background: red;
                transform: rotate(0deg) scale(1);
            }
            25% {
                background: yellow;
                transform: rotate(90deg) scale(1.1);
                color: #000;
            }
            50% {
                background: blue;
                transform: rotate(180deg) scale(1);
                color: #fff;
            }
            75% {
                background: green;
                transform: rotate(270deg) scale(1.1);
            }
            100% {
                background: red;
                transform: rotate(360deg) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="box">动画盒子</div>
</body>
</html>
