<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 3D立方体动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            perspective: 800px;  /* 透视，产生3D景深 */
        }
        .cube {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d; /* 开启子元素3D空间 */
            animation: rotateCube 8s linear infinite;
        }
        .cube div {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 1px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #fff;
            opacity: 0.8;
        }
        .front  { background: #e74c3c; transform: translateZ(100px); }
        .back   { background: #3498db; transform: translateZ(-100px) rotateY(180deg); }
        .left   { background: #2ecc71; transform: translateX(-100px) rotateY(-90deg); }
        .right  { background: #f39c12; transform: translateX(100px) rotateY(90deg); }
        .top    { background: #9b59b6; transform: translateY(-100px) rotateX(90deg); }
        .bottom { background: #1abc9c; transform: translateY(100px) rotateX(-90deg); }

        @keyframes rotateCube {
            0% {
                transform: rotateX(0deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="cube">
        <div class="front">前</div>
        <div class="back">后</div>
        <div class="left">左</div>
        <div class="right">右</div>
        <div class="top">上</div>
        <div class="bottom">下</div>
    </div>
</body>
</html>
