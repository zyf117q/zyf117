<script type="module">
    import * as THREE from "three";

    // ====== 简化版 OrbitControls（不用下载）======
    function zyf_117_Orbit(cam, dom) {
        let isDown = false, lastX = 0, lastY = 0;
        let rotY = 0.4, rotX = 0.3, scale = 1;
        const minDist = 8, maxDist = 60;
        function onDown(e) { isDown = true; lastX = e.clientX; lastY = e.clientY; }
        function onUp() { isDown = false; }
        function onMove(e) {
            if (!isDown) return;
            const dx = e.clientX - lastX; const dy = e.clientY - lastY;
            rotY += dx * 0.005; rotX += dy * 0.005;
            rotX = Math.max(-1.2, Math.min(1.2, rotX));
            lastX = e.clientX; lastY = e.clientY;
        }
        function onWheel(e) {
            e.preventDefault(); scale *= e.deltaY > 0 ? 1.1 : 0.9;
            scale = Math.max(0.4, Math.min(2.5, scale));
        }
        dom.addEventListener("mousedown", onDown);
        window.addEventListener("mouseup", onUp);
        window.addEventListener("mousemove", onMove);
        dom.addEventListener("wheel", onWheel, { passive: false });
        function update() {
            const dist = 25 * scale;
            cam.position.x = dist * Math.sin(rotY) * Math.cos(rotX);
            cam.position.y = dist * Math.sin(rotX);
            cam.position.z = dist * Math.cos(rotY) * Math.cos(rotX);
            cam.lookAt(0, 0, 0);
        }
        return { update };
    }

    // ====== 通用初始化 ======
    function zyf_117_init(cv) {
        const parent = cv.parentElement;
        const W = parent.clientWidth; const H = parent.clientHeight;
        const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(W, H);
        return { renderer, W, H };
    }

    // ====== 3D 柱状图 ======
    (function barChart() {
        const cv = document.getElementById("zyf_117_canvas_bar");
        const { renderer, W, H } = zyf_117_init(cv);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 1000);
        camera.position.set(12, 10, 15);

        // 光照
        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        const dir = new THREE.DirectionalLight(0xffffff, 0.9);
        dir.position.set(10, 20, 10); scene.add(dir);
        const rim = new THREE.DirectionalLight(0xa855f7, 0.4);
        rim.position.set(-10, 5, -10); scene.add(rim);

        // 地面网格
        const grid = new THREE.GridHelper(20, 20, 0x445588, 0x223355);
        grid.position.y = 0; scene.add(grid);

        // 柱子数据
        const data = [
            { name: "服饰", val: 3820, color: 0x5b8cff },
            { name: "数码", val: 5460, color: 0xa855f7 },
            { name: "家居", val: 2980, color: 0x22c55e },
            { name: "美妆", val: 4120, color: 0xec4899 },
            { name: "食品", val: 3360, color: 0xe6c87a },
            { name: "运动", val: 2750, color: 0x06b6d4 },
        ];
        const max = Math.max(...data.map(d => d.val));
        const barWidth = 1.2; const gap = 0.5;
        const totalW = data.length * (barWidth + gap) - gap;
        const startX = -totalW / 2 + barWidth / 2;

        const bars = [];
        data.forEach((d, i) => {
            const h = (d.val / max) * 8 + 0.2;
            const geo = new THREE.BoxGeometry(barWidth, h, barWidth);
            const mat = new THREE.MeshStandardMaterial({
                color: d.color, transparent: true, opacity: 0.9,
                roughness: 0.35, metalness: 0.1,
            });
            const bar = new THREE.Mesh(geo, mat);
            bar.position.set(startX + i * (barWidth + gap), h / 2, 0);
            scene.add(bar); bars.push({ mesh: bar, baseY: h });

            // 顶部发光环
            const ring = new THREE.Mesh(
                new THREE.RingGeometry(barWidth*0.55, barWidth*0.75, 32),
                new THREE.MeshBasicMaterial({ color: d.color, side: THREE.DoubleSide, transparent: true, opacity: 0.7 })
            );
            ring.rotation.x = -Math.PI/2;
            ring.position.set(startX + i * (barWidth + gap), h + 0.01, 0);
            scene.add(ring);

            // 数字标签（Canvas Sprite）
            const spr = zyf_117_makeSprite(d.val + "万", d.color);
            spr.position.set(startX + i * (barWidth + gap), h + 0.8, 0);
            scene.add(spr);
        });

        // 坐标轴 Y 箭头
        const yAxis = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(-10, 0, 0), 10, 0x3b82f6);
        scene.add(yAxis);

        const ctrl = zyf_117_Orbit(camera, cv);

        let frame = 0;
        function animate() {
            frame++;
            ctrl.update();
            // 柱子轻微脉动
            bars.forEach((b, i) => {
                b.mesh.position.y = b.baseY / 2 + Math.sin(frame * 0.03 + i) * 0.05;
            });
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener("resize", () => {
            const p = cv.parentElement;
            renderer.setSize(p.clientWidth, p.clientHeight);
            camera.aspect = p.clientWidth / p.clientHeight; camera.updateProjectionMatrix();
        });
    })();

    // ====== Sprite 生成器 ======
    function zyf_117_makeSprite(text, hexColor) {
        const canvas = document.createElement("canvas");
        canvas.width = 256; canvas.height = 128;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, 256, 128);
        ctx.font = "bold 48px Microsoft YaHei";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.fillText(text, 128, 64);
        const tex = new THREE.CanvasTexture(canvas);
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const spr = new THREE.Sprite(mat);
        spr.scale.set(2, 1, 1);
        return spr;
    }

    // ====== 3D 散点星云 ======
    (function scatterChart() {
        const cv = document.getElementById("zyf_117_canvas_scatter");
        const { renderer, W, H } = zyf_117_init(cv);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 2000);
        camera.position.set(0, 5, 30);

        // 灯光（粒子自发光，其实不需要，但加一点 ambient 让环境不暗）
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));

        // 星空背景粒子（1000 个小点）
        const bgGeo = new THREE.BufferGeometry();
        const bgPositions = [];
        for (let i = 0; i < 1500; i++) {
            bgPositions.push((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
        }
        bgGeo.setAttribute("position", new THREE.Float32BufferAttribute(bgPositions, 3));
        const bgMat = new THREE.PointsMaterial({ color: 0x4466aa, size: 0.15, transparent: true, opacity: 0.6 });
        const bgStars = new THREE.Points(bgGeo, bgMat);
        scene.add(bgStars);

        // 分类数据（4 类 × 20 点 = 80 个活跃用户点）
        const cats = [
            { name: "服饰", color: 0x5b8cff, cx: -8, cy: 3, cz: -5 },
            { name: "数码", color: 0xa855f7, cx: 8, cy: 5, cz: 3 },
            { name: "家居", color: 0x22c55e, cx: -4, cy: -4, cz: 6 },
            { name: "美妆", color: 0xec4899, cx: 6, cy: -3, cz: -8 },
        ];

        cats.forEach(c => {
            const positions = []; const colors = []; const sizes = [];
            for (let i = 0; i < 40; i++) {
                // 以 cx,cy,cz 为中心的高斯分布
                positions.push(
                    c.cx + (Math.random() - 0.5) * 14,
                    c.cy + (Math.random() - 0.5) * 12,
                    c.cz + (Math.random() - 0.5) * 14
                );
                colors.push(c.color / 0xffffff);
                sizes.push(0.08 + Math.random() * 0.18);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute("size", new THREE.Float32BufferAttribute(sizes, 1));
            const mat = new THREE.PointsMaterial({
                color: c.color, sizeAttenuation: true, size: 0.4,
                transparent: true, opacity: 0.85, depthWrite: false,
                blending: THREE.AdditiveBlending,
            });
            const pts = new THREE.Points(geo, mat);
            pts.userData.color = c.color;
            scene.add(pts);
        });

        // 中心发光球
        const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.8, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xe6c87a, transparent: true, opacity: 0.9 })
        );
        scene.add(core);

        const ctrl = zyf_117_Orbit(camera, cv);

        let frame = 0;
        function animate() {
            frame++;
            ctrl.update();
            bgStars.rotation.y += 0.0008;
            scene.children.forEach(obj => {
                if (obj.isPoints && obj !== bgStars) {
                    obj.rotation.y += 0.003;
                }
            });
            core.scale.setScalar(1 + Math.sin(frame * 0.05) * 0.2);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener("resize", () => {
            const p = cv.parentElement;
            renderer.setSize(p.clientWidth, p.clientHeight);
            camera.aspect = p.clientWidth / p.clientHeight; camera.updateProjectionMatrix();
        });
    })();
</script>
