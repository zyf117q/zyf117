<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 3D卡片翻转</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            perspective: 600px;
        }
        .card-box {
            width: 300px;
            height: 400px;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }
        /* 鼠标悬浮翻转180度 */
        .card-box:hover .card {
            transform: rotateY(180deg);
        }
        .front-card, .back-card {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* 背面看不见 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: white;
            border-radius: 12px;
        }
        .front-card {
            background: #3498db;
        }
        .back-card {
            background: #e67e22;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <div class="card-box">
        <div class="card">
            <div class="front-card">卡片正面</div>
            <div class="back-card">卡片背面</div>
        </div>
    </div>
</body>
</html>
