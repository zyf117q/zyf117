<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 层叠样式表 - 选择器与属性演示</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap"
        rel="stylesheet">
    <style>
        /* 通配符选择器：重置所有元素默认边距/内边距，让 box-sizing 更直观 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 标签选择器：body 整体样式（马卡龙渐变背景 + 中文字体栈 + 响应式最小高度） */
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #fdf6f0 0%, #fce4ec 50%, #d4f1e4 100%);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        /* 类选择器：外层容器，使用 max-width 而非固定 width → 响应式关键 */
        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* 标签选择器：页面主标题（深色居中 + 浅阴影 + 字间距） */
        h2 {
            color: #3d2d4f;
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, .8);
            letter-spacing: 2px;
        }

        /* id 选择器：核心展示卡片 (#box 是唯一 id) */
        #box {
            background-color: rgba(255, 255, 255, .85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(180, 160, 200, .25);
            transition: transform .3s ease, box-shadow .3s ease;
        }

        /* 伪类选择器：鼠标悬停时卡片轻微上浮并加深阴影 */
        #box:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(180, 160, 200, .35);
        }

        /* 标签选择器：二级标题（马卡龙粉装饰竖线） */
        h3 {
            color: #5c4b7a;
            font-size: 20px;
            border-left: 4px solid #f48fb1;
            padding-left: 12px;
            margin-bottom: 20px;
        }

        /* 类选择器：每个演示区块（马卡龙奶白背景 + 圆角 + 粉边） */
        .demo-section {
            margin-bottom: 24px;
            padding: 16px;
            background: #fdf6f0;
            border-radius: 10px;
            border: 1px solid #f8bbd9;
            transition: background .3s ease;
        }

        .demo-section:hover {
            background: #fce4ec;
        }

        /* 类选择器：区块上的小徽章标签（马卡龙粉胶囊） */
        .demo-label {
            display: inline-block;
            font-size: 13px;
            color: #7c4d6e;
            background: #f8bbd9;
            padding: 2px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        /* 标签选择器：修饰页面中全部 <p> 元素（红色 + 18px 字） */
        p {
            color: #ef4444;
            font-size: 18px;
            margin: 8px 0;
            padding-left: 4px;
        }

        /* 类选择器：张艺凡名字的容器 */
        .name {
            text-align: center;
            padding: 20px 0;
            letter-spacing: 6px;
        }

        /* 后代选择器：.name 下的所有 span
           - ZCOOL KuaiLe 手写艺术字体
           - background-clip:text 让渐变背景只裁剪在文字区域
           - -webkit-text-fill-color:transparent 隐藏填充色，露出背景渐变 */
        .name span {
            display: inline-block;
            font-family: "ZCOOL KuaiLe", "Ma Shan Zheng", "Microsoft YaHei", cursive;
            font-weight: normal;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: default;
            position: relative;
            transition: transform .3s cubic-bezier(.34, 1.56, .64, 1),
                filter .3s ease;
            animation: float 3s ease-in-out infinite;
        }

        /* 为三个字依次设置轻微的浮动动画延迟，产生波浪起伏感 */
        .name .z {
            animation-delay: 0s;
        }

        .name .y {
            animation-delay: .3s;
        }

        .name .f {
            animation-delay: .6s;
        }

        /* @keyframes：定义上下浮动动画 */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* 伪类 + 后代选择器：鼠标悬停时 —— 弹跳 + 发光
           注意：这里不能用 currentColor，因为 span 设了 -webkit-text-fill-color: transparent */
        .name span:hover {
            transform: scale(1.3) rotate(-8deg);
            animation-play-state: paused;
        }

        /* 每个字单独定义 hover 发光颜色（极光色系） */
        .name .z:hover {
            filter: drop-shadow(0 0 14px rgba(219, 39, 119, .7)) drop-shadow(0 4px 6px rgba(0, 0, 0, .25));
        }

        .name .y:hover {
            filter: drop-shadow(0 0 14px rgba(14, 165, 233, .7)) drop-shadow(0 4px 6px rgba(0, 0, 0, .25));
        }

        .name .f:hover {
            filter: drop-shadow(0 0 14px rgba(236, 72, 153, .7)) drop-shadow(0 4px 6px rgba(0, 0, 0, .25));
        }

        /* 类选择器："张" —— 靛蓝→品红 极光渐变 */
        .z {
            font-size: 32px;
            background-image: linear-gradient(135deg, #4f46e5, #db2777);
            text-shadow: none;
        }

        /* 类选择器："艺" —— 青→电光蓝 极光渐变（中间最大） */
        .y {
            font-size: 44px;
            background-image: linear-gradient(135deg, #0891b2, #0ea5e9);
            text-shadow: none;
        }

        /* 类选择器："凡" —— 紫→粉 极光渐变 */
        .f {
            font-size: 28px;
            background-image: linear-gradient(135deg, #7c3aed, #ec4899);
            text-shadow: none;
        }

        /* 类选择器：标签列表容器（Flex 弹性布局，自动换行） */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        /* 类选择器：单个属性标签（马卡龙渐变胶囊形） */
        .tag {
            background: linear-gradient(135deg, #f48fb1, #a5d6a7);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            transition: opacity .3s ease;
        }

        .tag:hover {
            opacity: .8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>层叠样式表 CSS</h2>
        <div id="box">
            <h3>CSS 选择器演示</h3>

            <div class="demo-section">
                <span class="demo-label">标签选择器 → p</span>
                <p>食品 - 标签选择器</p>
                <p>CSS 属性 - 标签选择器</p>
            </div>

            <div class="demo-section">
                <span class="demo-label">类选择器 → .name .z .y .f</span>
                <div class="name">
                    <span class="z">张</span>
                    <span class="y">艺</span>
                    <span class="f">凡</span>
                </div>
            </div>

            <div class="demo-section">
                <span class="demo-label">常用 CSS 属性</span>
                <div class="tag-list">
                    <span class="tag">color</span>
                    <span class="tag">font-size</span>
                    <span class="tag">background</span>
                    <span class="tag">padding</span>
                    <span class="tag">border</span>
                    <span class="tag">shadow</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
