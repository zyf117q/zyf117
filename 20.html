<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多个盒子3D动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #080c18;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
            perspective: 1000px;
            flex-wrap: wrap;
            padding: 50px;
        }
        /* 立方体公共样式 */
        .cube {
            width: 120px;
            height: 120px;
            position: relative;
            transform-style: preserve-3d;
        }
        .cube div {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 1px solid rgba(255,255,255,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: #fff;
        }
        .front  { transform: translateZ(60px); }
        .back   { transform: translateZ(-60px) rotateY(180deg); }
        .left   { transform: translateX(-60px) rotateY(-90deg); }
        .right  { transform: translateX(60px) rotateY(90deg); }
        .top    { transform: translateY(-60px) rotateX(90deg); }
        .bottom { transform: translateY(60px) rotateX(-90deg); }

        /* 第一个盒子动画 */
        .cube1 {
            animation: rotate1 6s linear infinite;
        }
        @keyframes rotate1 {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* 第二个盒子动画 */
        .cube2 {
            animation: rotate2 8s linear infinite;
        }
        @keyframes rotate2 {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(360deg); }
        }

        /* 第三个盒子动画 */
        .cube3 {
            animation: rotate3 10s linear infinite;
        }
        @keyframes rotate3 {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        /* 第四个盒子动画 */
        .cube4 {
            animation: rotate4 5s ease-in-out infinite alternate;
        }
        @keyframes rotate4 {
            0% { transform: rotateY(-30deg); }
            100% { transform: rotateY(30deg); }
        }
        /* 每个盒子单独配色 */
        .cube1 .front {background: rgba(231,76,60,0.6);}
        .cube1 .back  {background: rgba(52,152,219,0.6);}
        .cube1 .left  {background: rgba(46,204,113,0.6);}
        .cube1 .right {background: rgba(243,156,18,0.6);}
        .cube1 .top   {background: rgba(155,89,182,0.6);}
        .cube1 .bottom{background: rgba(26,188,156,0.6);}

        .cube2 .front {background: rgba(41,128,185,0.6);}
        .cube2 .back  {background: rgba(241,196,15,0.6);}
        .cube2 .left  {background: rgba(230,126,34,0.6);}
        .cube2 .right {background: rgba(155,89,182,0.6);}
        .cube2 .top   {background: rgba(26,188,156,0.6);}
        .cube2 .bottom{background: rgba(231,76,60,0.6);}

        .cube3 .front {background: rgba(155,89,182,0.6);}
        .cube3 .back  {background: rgba(26,188,156,0.6);}
        .cube3 .left  {background: rgba(231,76,60,0.6);}
        .cube3 .right {background: rgba(52,152,219,0.6);}
        .cube3 .top   {background: rgba(46,204,113,0.6);}
        .cube3 .bottom{background: rgba(243,156,18,0.6);}

        .cube4 .front {background: rgba(108,52,131,0.6);}
        .cube4 .back  {background: rgba(34,167,240,0.6);}
        .cube4 .left  {background: rgba(244,208,63,0.6);}
        .cube4 .right {background: rgba(235,152,78,0.6);}
        .cube4 .top   {background: rgba(22,160,133,0.6);}
        .cube4 .bottom{background: rgba(192,57,43,0.6);}
        </style>
</head>
<body>
    <!--盒子1-->
    <div class="cube cube1">
        <div class="front">1前</div>
        <div class="back">1后</div>
        <div class="left">1左</div>
        <div class="right">1右</div>
        <div class="top">1上</div>
        <div class="bottom">1下</div>
    </div>
    <!--盒子2-->
    <div class="cube cube2">
        <div class="front">2前</div>
        <div class="back">2后</div>
        <div class="left">2左</div>
        <div class="right">2右</div>
        <div class="top">2上</div>
        <div class="bottom">2下</div>
    </div>
    <!--盒子3-->
    <div class="cube cube3">
        <div class="front">3前</div>
        <div class="back">3后</div>
        <div class="left">3左</div>
        <div class="right">3右</div>
        <div class="top">3上</div>
        <div class="bottom">3下</div>
    </div>
    <!--盒子4-->
    <div class="cube cube4">
        <div class="front">4前</div>
        <div class="back">4后</div>
        <div class="left">4左</div>
        <div class="right">4右</div>
        <div class="top">4上</div>
        <div class="bottom">4下</div>
    </div>
</body>
</html>
