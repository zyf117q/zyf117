<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.css">
    <style>
        .text{
            color: violet !important;
            /* !important 优先级大于内联css */
        }
        #box p{
            color: silver;
        }
        .box p{
            color: purple;
        }
        #text{
            color: yellow;
        }
        .text{
            color: blue;
        }
        p{
            color: red;
        }
    </style>
</head>
<body>
    <h2>层叠与继承</h2>
    <div id="box" class="box">
        <p id="text" class="text">117 张艺凡</p>
        <p>CSS选择器的优先级</p>
    </div>
</body>
</html>
