<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上图下文卡片</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
        }
        img{}
        .slist{
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 20px;
        }
        .slist li{
            display: flex;
            flex-direction: column;
            align-items: center;
            border:1px solid #ccc;
            padding:12px;
            flex:1;
            border-radius: 8px;
            box-shadow: 0 2px 6px #eee;
        }
        .slist img{
            width: 100%;
            border-radius:4px;
        }
        .slist p{
            margin-top:10px;
            font-size:16px;
            color:#333;
            text-align:center;
        }
    </style>
</head>
<body>
    <ul class="slist">
        <li>
            <img src="campus.jpg">
            <p>校园图片</p>
        </li>
        <li>
            <img src="flower.jpg">
            <p>花朵图片</p>
        </li>
        <li>
            <img src="heart.jpg">
            <p>爱心图片</p>
        </li>
    </ul>
</body>
</html>
